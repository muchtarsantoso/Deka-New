<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaksi - DeKa Cell</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-900 text-white flex justify-center">

    <div class="w-full max-w-md bg-gray-900 min-h-screen relative shadow-2xl pb-24">
        
        <!-- Header -->
        <header class="flex items-center p-4 sticky top-0 bg-gray-900 z-50 border-b border-gray-800">
            <a href="index.html" class="text-gray-400 hover:text-white mr-4 transition">
                <i class="fas fa-arrow-left text-xl"></i>
            </a>
            <h1 id="judul-header" class="font-bold text-lg">Isi Produk</h1>
        </header>

        <!-- Info Provider Dinamis (Update Pakai Gambar) -->
        <div class="p-4 flex items-center gap-4 bg-gray-800 border-b border-gray-700">
            <div id="badge-logo" class="w-16 h-16 bg-gray-800 border border-gray-700 rounded-2xl flex items-center justify-center shadow-lg overflow-hidden">
                <!-- Gambar akan diisi oleh Javascript -->
                <i class="fas fa-spinner fa-spin text-gray-400"></i>
            </div>
            <div>
                <h2 id="nama-provider" class="font-bold text-xl">Memuat...</h2>
                <p class="text-xs text-gray-400"><i class="fas fa-bolt text-yellow-400"></i> Proses Otomatis 24/7</p>
            </div>
        </div>

        <main class="p-4 space-y-6">
            <!-- Langkah 1: Nomor HP -->
            <div>
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold">1</div>
                    <h3 class="font-bold">Masukkan Nomor / ID Tujuan</h3>
                </div>
                <label class="text-xs text-gray-400 mb-1 block">Nomor Tujuan *</label>
                <input type="text" inputmode="numeric" id="input-nomor" placeholder="08xxxxxxxxxx" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500 transition">
            </div>

            <!-- Langkah 2: Pilih Nominal & Filter Kategori -->
            <div>
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold">2</div>
                    <h3 class="font-bold">Pilih Nominal / Paket</h3>
                </div>

                <!-- CONTAINER TAB KATEGORI -->
                <div id="kategori-container" class="flex gap-2 overflow-x-auto pb-2 mb-3 no-scrollbar">
                    <!-- Tombol kategori diisi JS -->
                </div>

                <!-- Grid Produk (Otomatis Melar jika dipilih) -->
                <div class="grid grid-cols-2 gap-3" id="daftar-produk">
                    <div class="col-span-2 text-center text-gray-400 py-6">Sedang mengambil produk dari Google Sheets...</div>
                </div>
            </div>

            <!-- Langkah 3: Pilih Pembayaran -->
            <div>
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold">3</div>
                    <h3 class="font-bold">Pilih Pembayaran</h3>
                </div>
                <!-- Div QRIS Aktif Bawaan (Border Blue) -->
                <div id="metode-qris" class="bg-gray-800 border-2 border-blue-500 rounded-xl p-4 flex justify-between items-center cursor-pointer transition">
                    <div class="flex items-center gap-3 pointer-events-none">
                        <i class="fas fa-qrcode text-2xl text-blue-400"></i>
                        <div>
                            <h4 class="font-bold text-sm">QRIS All Payment</h4>
                            <p class="text-xs text-gray-400">Bebas biaya admin</p>
                        </div>
                    </div>
                    <!-- Radio Button Aktif (bg-blue-500) -->
                    <div id="radio-qris" class="w-5 h-5 rounded-full border-2 border-blue-500 bg-blue-500 flex items-center justify-center pointer-events-none transition">
                        <i class="fas fa-check text-[10px] text-white"></i>
                    </div>
                </div>
            </div>
        </main>

        <!-- Tombol Checkout Bawah -->
        <div class="fixed bottom-12 w-full max-w-md bg-gray-900 border-t border-gray-800 p-4 flex justify-between items-center z-40">
            <div>
                <p class="text-xs text-gray-400 mb-1">Total Harga</p>
                <p id="total-harga-teks" class="font-bold text-lg text-blue-400">-</p>
            </div>
            <button id="tombol-pesan" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full transition shadow-lg flex items-center gap-2 opacity-50 cursor-not-allowed">
                <i class="fas fa-shopping-bag"></i> Pesan Sekarang!
            </button>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 w-full max-w-md bg-gray-900/90 backdrop-blur-md border-t border-gray-800 p-2 flex justify-around items-center z-50">
            <a href="index.html" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-300">
                <i class="fas fa-home text-lg"></i>
                <span class="text-[10px] font-medium">Beranda</span>
            </a>
            <button onclick="bukaRiwayat()" class="flex flex-col items-center gap-1 text-blue-500 transition">
                <i class="fas fa-history text-lg"></i>
                <span class="text-[10px] font-medium">Riwayat Transaksi</span>
            </button>
        </nav>

        <!-- MODAL RIWAYAT TRANSAKSI -->
        <div id="modal-riwayat" class="fixed inset-0 bg-gray-900 z-[60] flex-col hidden transition-opacity duration-300">
            <header class="flex items-center justify-between p-4 sticky top-0 bg-gray-900 border-b border-gray-800 shadow-md">
                <div class="flex items-center gap-3">
                    <button onclick="tutupRiwayat()" class="text-gray-400 hover:text-white active:scale-90 transition">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </button>
                    <h1 class="font-bold text-lg">Riwayat Transaksi</h1>
                </div>
            </header>
            <div id="list-riwayat" class="flex-1 overflow-y-auto p-3 space-y-2 pb-10 bg-gray-900">
                <!-- Akan dimuat oleh JS -->
            </div>
        </div>

    </div>

    <!-- SCRIPT LOGIKA TRANSAKSI -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const providerTarget = urlParams.get('provider') || 'Telkomsel';

        const judulHeader = document.getElementById('judul-header');
        const namaProvider = document.getElementById('nama-provider');
        const badgeLogo = document.getElementById('badge-logo');
        const inputNomor = document.getElementById('input-nomor');
        const teksTotalHarga = document.getElementById('total-harga-teks');
        const tombolPesan = document.getElementById('tombol-pesan');
        const kategoriContainer = document.getElementById('kategori-container');
        const daftarProduk = document.getElementById('daftar-produk');

        const webAppUrl = "https://script.google.com/macros/s/AKfycbwVdzWWQZ8o1cUYnnWgmexuCOMl9wL2iw-l0GxPtkzvOGEKczoXgcmSqBcsKZUGrmDKiA/exec";

        let semuaProduk = [];
        let produkSaatIni = []; 
        
        let produkTerpilih = null; 
        let kodeProdukTerpilih = '';
        let namaProdukTerpilih = '';
        let hargaTerpilih = 0;
        let pembayaranTerpilih = true; 

        // SANITASI NOMOR HP
        inputNomor.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, ''); 
            cekKelengkapan();
        });

        function formatRupiah(angka) {
            return 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function aturTampilanProvider(p) {
            judulHeader.innerText = "Isi " + p;
            namaProvider.innerText = p;

            let namaLower = p.toLowerCase();
            let imgSrc = "";
            
            // Pencocokan gambar logo sesuai link Google Drive yang diberikan di beranda
            if (namaLower.includes('telkomsel')) {
                imgSrc = "https://lh3.googleusercontent.com/d/1Z-ZQuFff3Ty1iGaiY-U13R-sL6Yy1J7t";
            } else if (namaLower.includes('indosat')) {
                imgSrc = "https://lh3.googleusercontent.com/d/1WJ7ZccDWmHxvHV5ZFxxdLXEqITYYR3zf";
            } else if (namaLower.includes('by.u') || namaLower.includes('byu')) {
                imgSrc = "https://lh3.googleusercontent.com/d/1AwUwRBsjlBayp5lDhko1yPA9IXYHyHVd";
            } else if (namaLower.includes('xl')) {
                imgSrc = "https://lh3.googleusercontent.com/d/1CWc5DlujKGcijDWRzNKRsgdByemL6JuO";
            } else if (namaLower.includes('axis')) {
                imgSrc = "https://lh3.googleusercontent.com/d/1IrFIrT35QEJx6NPsHdsSnbDkjFHS5R83";
            } else if (namaLower.includes('tri') || namaLower === '3') {
                imgSrc = "https://lh3.googleusercontent.com/d/1xLOcIFwS-E5cpw7TxRGlouV7cOZqUHC8";
            } else if (namaLower.includes('smartfren')) {
                imgSrc = "https://lh3.googleusercontent.com/d/1cWa6gihDQaBJYNfjFdnOujiIweoeZp2l";
            } else if (namaLower.includes('pln') || namaLower.includes('token')) {
                imgSrc = "https://lh3.googleusercontent.com/d/1tyTu0mvaYjKG1ZgPF750mOBAKM6qpHzS";
            } else if (namaLower.includes('wallet') || namaLower.includes('dana') || namaLower.includes('ovo')) {
                imgSrc = "https://lh3.googleusercontent.com/d/15ja1tqi18l__WEiSYn8VB-D8SDeWeauo";
            } else {
                imgSrc = "logo.png"; // Fallback default
            }

            badgeLogo.innerHTML = `<img src="${imgSrc}" alt="${p}" class="w-full h-full object-cover">`;
        }

        async function ambilProduk() {
            aturTampilanProvider(providerTarget);
          
            try {
                const response = await fetch(`${webAppUrl}?action=getProducts&provider=${encodeURIComponent(providerTarget)}`); 
                semuaProduk = await response.json();
            
                if (semuaProduk.length === 0) {
                    daftarProduk.innerHTML = `<div class="col-span-2 text-center text-gray-400 py-6">Tidak ada produk ${providerTarget} yang aktif.</div>`;
                    return;
                }

                const isPln = providerTarget.toLowerCase().includes('pln');

                if (isPln) {
                    kategoriContainer.innerHTML = '';
                    kategoriContainer.style.display = 'none';
                    tampilkanProduk('Semua');
                } else {
                    kategoriContainer.style.display = 'flex';
                    buatTabKategori();
                    tampilkanProduk('Semua');
                }

            } catch (error) {
                console.error('Error:', error);
                daftarProduk.innerHTML = '<div class="col-span-2 text-center text-red-400 py-6">Gagal memuat produk dari server.</div>';
            }
        }

        function buatTabKategori() {
            kategoriContainer.innerHTML = '';
            const listKategori = ['Semua', ...new Set(semuaProduk.map(p => p.kategori))];

            listKategori.forEach((kat, index) => {
                let icon = '';
                let kLower = kat.toLowerCase();
                
                if(kLower.includes('dana')) icon = '<i class="fas fa-wallet mr-1 text-blue-400"></i>';
                else if(kLower.includes('ovo')) icon = '<i class="fas fa-circle mr-1 text-purple-400"></i>';
                else if(kLower.includes('gopay')) icon = '<i class="fas fa-motorcycle mr-1 text-green-400"></i>';
                else if(kLower.includes('shopee')) icon = '<i class="fas fa-shopping-bag mr-1 text-orange-400"></i>';
                else if(kLower.includes('link')) icon = '<i class="fas fa-link mr-1 text-red-400"></i>';

                const btn = document.createElement('button');
                btn.className = `btn-kategori whitespace-nowrap px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center ${index === 0 ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400 border border-gray-700 hover:text-white'}`;
                btn.innerHTML = `${icon} ${kat}`;
                
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.btn-kategori').forEach(b => {
                        b.className = 'btn-kategori whitespace-nowrap px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center bg-gray-800 text-gray-400 border border-gray-700 hover:text-white';
                    });
                    this.className = 'btn-kategori whitespace-nowrap px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center bg-blue-600 text-white';
                    
                    tampilkanProduk(kat);
                });

                kategoriContainer.appendChild(btn);
            });
        }

        function tampilkanProduk(kategoriAktif) {
            produkTerpilih = null;
            hargaTerpilih = 0;
            teksTotalHarga.innerText = '-';
            cekKelengkapan();

            produkSaatIni = kategoriAktif === 'Semua' 
                ? semuaProduk 
                : semuaProduk.filter(p => p.kategori === kategoriAktif);

            renderGrid();
        }

        function renderGrid() {
            daftarProduk.innerHTML = '';

            if (produkSaatIni.length === 0) {
                daftarProduk.innerHTML = '<div class="col-span-2 text-center text-gray-400 py-6">Tidak ada produk di kategori ini.</div>';
                return;
            }

            produkSaatIni.forEach(p => {
                const isSelected = produkTerpilih && produkTerpilih.kode === p.kode;
                
                const colClass = isSelected 
                    ? "col-span-2 bg-blue-600 border-blue-400 shadow-lg shadow-blue-900/50 scale-[1.02]" 
                    : "col-span-1 bg-gray-800 border-gray-700 hover:border-gray-500 hover:bg-gray-700/80";

                let detailHtml = '';
                
                if (isSelected) {
                    detailHtml = `
                        <div class="mt-4 pt-3 border-t border-blue-400/40 text-xs space-y-2.5 text-blue-50 transition-all duration-300">
                            <div class="flex flex-col gap-0.5">
                                <span class="text-[10px] text-blue-300 uppercase font-bold tracking-wider">Kategori</span>
                                <span class="font-semibold bg-blue-700/50 px-2 py-1 rounded w-fit">${p.kategori}</span>
                            </div>
                            <div class="flex flex-col gap-0.5">
                                <span class="text-[10px] text-blue-300 uppercase font-bold tracking-wider">Keterangan</span>
                                <span class="leading-relaxed font-medium break-words whitespace-pre-wrap">${p.keterangan_full}</span>
                            </div>
                            <div class="flex flex-col gap-0.5">
                                <span class="text-[10px] text-amber-300 uppercase font-bold tracking-wider"><i class="fas fa-info-circle"></i> Note</span>
                                <span class="leading-relaxed font-medium italic ${p.note !== '-' && p.note !== '' ? 'text-amber-100' : 'text-blue-200 opacity-70'}">${p.note || '-'}</span>
                            </div>
                        </div>
                    `;
                }

                const divProduk = document.createElement('div');
                divProduk.className = `border rounded-xl p-3.5 cursor-pointer transition-all duration-300 ease-out flex flex-col justify-between ${colClass}`;
                
                divProduk.onclick = () => {
                    produkTerpilih = p;
                    kodeProdukTerpilih = p.kode;
                    namaProdukTerpilih = p.nama;
                    hargaTerpilih = parseInt(p.harga);
                    teksTotalHarga.innerText = formatRupiah(hargaTerpilih);
                    
                    cekKelengkapan();
                    renderGrid();
                };

                divProduk.innerHTML = `
                    <div>
                        <h4 class="font-bold text-sm ${isSelected ? 'text-white' : 'text-gray-200'} leading-tight mb-2">${p.nama}</h4>
                    </div>
                    <p class="${isSelected ? 'text-blue-200' : 'text-blue-400'} font-extrabold text-[15px]">${formatRupiah(p.harga)}</p>
                    ${detailHtml}
                `;

                daftarProduk.appendChild(divProduk);
            });
        }

        ambilProduk();

        function cekKelengkapan() {
            if (inputNomor.value.length >= 5 && hargaTerpilih > 0 && pembayaranTerpilih) {
                tombolPesan.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                tombolPesan.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        // --- SISTEM MODAL RIWAYAT ---
        function maskNomor(n) {
            if (!n || n.length < 7) return n;
            return n.substring(0, n.length - 5) + "***" + n.substring(n.length - 2);
        }

        function bukaRiwayat() {
            document.getElementById('modal-riwayat').classList.remove('hidden');
            document.getElementById('modal-riwayat').classList.add('flex');
            muatRiwayat();
        }

        function tutupRiwayat() {
            document.getElementById('modal-riwayat').classList.add('hidden');
            document.getElementById('modal-riwayat').classList.remove('flex');
        }

        async function muatRiwayat() {
            const listContainer = document.getElementById('list-riwayat');
            listContainer.innerHTML = '<div class="text-center text-gray-500 py-10"><i class="fas fa-spinner fa-spin text-3xl mb-3"></i><p class="text-sm">Mengambil riwayat terbaru...</p></div>';
            
            try {
                let res = await fetch(`${webAppUrl}?action=getProducts&sub_action=getRiwayat`);
                let data = await res.json();

                if (data.length === 0) {
                    listContainer.innerHTML = '<div class="text-center text-gray-500 py-10">Belum ada transaksi.</div>';
                    return;
                }

                listContainer.innerHTML = '';
                
                data.forEach(item => {
                    let st = item.status ? item.status.toUpperCase() : 'PROSES';
                    let bg = st === 'SUKSES' || st === 'SUCCESS' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : (st === 'GAGAL' || st === 'FAILED' ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-blue-500/20 text-blue-400 border-blue-500/30');
                    if(st === 'SUCCESS') st = 'SUKSES';
                    if(st === 'FAILED') st = 'GAGAL';

                    let card = document.createElement('a');
                    card.href = `bayar.html?id_trx=${item.id}&produk=${encodeURIComponent(item.produk)}&nomor=${encodeURIComponent(item.nomor)}&total_unik=${item.harga}`;
                    card.className = "bg-gray-800 border border-gray-700 rounded-xl p-3 flex justify-between items-center transition hover:bg-gray-700 cursor-pointer block";
                    
                    card.innerHTML = `
                        <div class="flex-1 pr-3">
                            <h4 class="text-sm font-bold text-gray-200 truncate">${item.produk}</h4>
                            <p class="text-xs text-gray-400 font-mono mt-0.5">${maskNomor(item.nomor)}</p>
                            <p class="text-[10px] text-gray-500 mt-1"><i class="far fa-clock mr-1"></i>${item.tanggal}</p>
                        </div>
                        <div class="text-right flex flex-col items-end gap-1.5">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${bg}">${st}</span>
                            <span class="text-sm font-bold text-gray-300">${formatRupiah(item.harga)}</span>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            } catch (err) {
                listContainer.innerHTML = '<div class="text-center text-red-400 py-10">Gagal mengambil riwayat. Silakan periksa koneksi Anda.</div>';
            }
        }

        // KLIK TOMBOL PESAN SEKARANG
        tombolPesan.addEventListener('click', async function() {
            if (!this.classList.contains('cursor-not-allowed')) {
                let nomorTujuan = inputNomor.value;
                let idTrx = Math.random().toString(36).substring(2, 10).toUpperCase();
                let kodeUnik = Math.floor(Math.random() * 499) + 100;
                let totalUnik = hargaTerpilih + kodeUnik;

                tombolPesan.disabled = true;
                tombolPesan.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';

                try {
                    let urlKirim = `${webAppUrl}?action=addTransaction&id_trx=${idTrx}&kode_produk=${encodeURIComponent(kodeProdukTerpilih)}&no_hp=${encodeURIComponent(nomorTujuan)}&total_bayar=${hargaTerpilih}&total_unik=${totalUnik}`;
                    
                    await fetch(urlKirim);

                    let paramBayar = `id_trx=${idTrx}&produk=${encodeURIComponent(namaProdukTerpilih)}&nomor=${encodeURIComponent(nomorTujuan)}&total_unik=${totalUnik}&provider=${encodeURIComponent(providerTarget)}`;
                    window.location.href = `bayar.html?${paramBayar}`;

                } catch (err) {
                    alert("Gagal menghubungkan ke server. Silakan coba lagi.");
                    tombolPesan.disabled = false;
                    tombolPesan.innerHTML = '<i class="fas fa-shopping-bag"></i> Pesan Sekarang!';
                }
            }
        });
    </script>
</body>
</html>
